  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="2.4" y="2.4" width="59.2" height="59.2" rx="12" fill="none" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.2"/>
  <g fill="#f4f8ff">
